<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto 5 Anos</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #0d0d0d;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.caixa {
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    background: #1a1a1a;
    border-radius: 15px;
}

.numero {
    font-size: 40px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 18px;
    margin-top: 15px;
    border: 0;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    background: white;
    color: black;
}

button:disabled {
    opacity: 0.5;
}

.barra {
    height: 15px;
    background: #333;
    border-radius: 20px;
    margin-top: 15px;
    overflow: hidden;
}

.progresso {
    height: 100%;
    width: 0%;
    background: white;
}

p {
    color: #aaa;
}
</style>
</head>

<body>

<h1>PROJETO 5 ANOS</h1>

<p>1.826 dias de consistência</p>

<div class="caixa">

<h2>Dias feitos</h2>
<div class="numero" id="dias">0</div>

</div>

<div class="caixa">

<h2>Sequência</h2>
<div class="numero" id="sequencia">0</div>

</div>

<div class="caixa">

<h2>Placar</h2>
<div class="numero" id="placar">0</div>

</div>

<div class="caixa">

<button id="botao" onclick="marcarPresenca()">
MARCAR PRESENÇA HOJE
</button>

<p id="mensagem">
Você ainda não marcou presença hoje.
</p>

</div>

<div class="caixa">

<h2>Progresso</h2>

<div class="barra">
<div class="progresso" id="progresso"></div>
</div>

<p id="textoProgresso">
0 / 1.826 dias
</p>

</div>

<div class="caixa">

<h2>Mensagem</h2>

<p id="motivacao">
Comece hoje. Um dia de cada vez.
</p>

</div>

<script>

var TOTAL = 1826;

var dias = [];
var placar = 0;

try {

    var dadosSalvos =
        localStorage.getItem("projeto5anos");

    if (dadosSalvos) {

        var dados =
            JSON.parse(dadosSalvos);

        dias = dados.dias || [];
        placar = dados.placar || 0;

    }

} catch (erro) {

    dias = [];
    placar = 0;

}


function dataHoje() {

    var agora = new Date();

    var ano = agora.getFullYear();

    var mes = String(
        agora.getMonth() + 1
    ).padStart(2, "0");

    var dia = String(
        agora.getDate()
    ).padStart(2, "0");

    return ano + "-" + mes + "-" + dia;
}


function salvar() {

    localStorage.setItem(
        "projeto5anos",
        JSON.stringify({
            dias: dias,
            placar: placar
        })
    );

}


function marcarPresenca() {

    var hoje = dataHoje();

    if (dias.indexOf(hoje) !== -1) {
        return;
    }

    dias.push(hoje);

    placar += 10;

    salvar();

    atualizar();

}


function calcularSequencia() {

    var total = 0;

    var data = new Date();

    while (true) {

        var ano = data.getFullYear();

        var mes = String(
            data.getMonth() + 1
        ).padStart(2, "0");

        var dia = String(
            data.getDate()
        ).padStart(2, "0");

        var atual =
            ano + "-" + mes + "-" + dia;

        if (dias.indexOf(atual) === -1) {
            break;
        }

        total++;

        data.setDate(
            data.getDate() - 1
        );

    }

    return total;

}


function atualizar() {

    var hoje = dataHoje();

    document.getElementById("dias")
        .innerText = dias.length;

    document.getElementById("placar")
        .innerText = placar;

    document.getElementById("sequencia")
        .innerText = calcularSequencia();

    var percentual =
        (dias.length / TOTAL) * 100;

    if (percentual > 100) {
        percentual = 100;
    }

    document.getElementById("progresso")
        .style.width = percentual + "%";

    document.getElementById("textoProgresso")
        .innerText =
        dias.length +
        " / " +
        TOTAL +
        " dias — " +
        percentual.toFixed(2) +
        "%";

    var botao =
        document.getElementById("botao");

    if (dias.indexOf(hoje) !== -1) {

        botao.disabled = true;

        botao.innerText =
            "PRESENÇA MARCADA ✓";

        document.getElementById("mensagem")
            .innerText =
            "Presença registrada hoje.";

    } else {

        botao.disabled = false;

        botao.innerText =
            "MARCAR PRESENÇA HOJE";

        document.getElementById("mensagem")
            .innerText =
            "Você ainda não marcou presença hoje.";

    }

}


atualizar();

</script>

</body>
</html>
