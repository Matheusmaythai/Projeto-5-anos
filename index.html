<script>
const TOTAL_DAYS = 1826;
const STORAGE_KEY = "projeto_5_anos_v2";

let data = {
    days: [],
    score: 0
};

try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
        data = JSON.parse(saved);
    }
} catch (e) {
    data = {
        days: [],
        score: 0
    };
}

function hoje() {
    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
}

function salvar() {
    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );
    } catch (e) {
        console.log("Não foi possível salvar.");
    }
}

function sequencia() {
    let total = 0;
    let d = new Date();

    while (true) {

        const dataAtual =
            d.getFullYear() + "-" +
            String(d.getMonth() + 1).padStart(2, "0") + "-" +
            String(d.getDate()).padStart(2, "0");

        if (!data.days.includes(dataAtual)) {
            break;
        }

        total++;

        d.setDate(d.getDate() - 1);
    }

    return total;
}

function atualizar() {

    const hojeAtual = hoje();
    const marcou = data.days.includes(hojeAtual);

    document.getElementById("days").textContent =
        data.days.length;

    document.getElementById("score").textContent =
        data.score;

    document.getElementById("streak").textContent =
        sequencia();

    const porcentagem =
        Math.min(100, (data.days.length / TOTAL_DAYS) * 100);

    document.getElementById("progress").style.width =
        porcentagem + "%";

    document.getElementById("progressText").textContent =
        data.days.length + " / " +
        TOTAL_DAYS + " dias — " +
        porcentagem.toFixed(2) + "%";

    const botao =
        document.getElementById("presence");

    if (marcou) {

        botao.disabled = true;
        botao.textContent = "PRESENÇA MARCADA ✓";

        document.getElementById("status").textContent =
            "Você já marcou presença hoje.";

    } else {

        botao.disabled = false;
        botao.textContent =
            "MARCAR PRESENÇA HOJE";

        document.getElementById("status").textContent =
            "Você ainda não marcou presença hoje.";
    }
}

function marcarPresenca() {

    const dataHoje = hoje();

    if (data.days.includes(dataHoje)) {
        return;
    }

    data.days.push(dataHoje);

    data.score += 10;

    salvar();

    atualizar();
}

atualizar();
</script>
