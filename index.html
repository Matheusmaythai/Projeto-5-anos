<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Projeto 5 Anos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #0d0f12;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 25px;
}

.card {
    background: #171a1f;
    border: 1px solid #292e36;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.stat {
    background: #101216;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.number {
    font-size: 28px;
    font-weight: bold;
}

.label {
    font-size: 12px;
    color: #999;
    margin-top: 5px;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}
